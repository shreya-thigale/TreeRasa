services:
  postgres:
    image: postgres:16-alpine
    container_name: treerasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: treerasa
      POSTGRES_USER: treerasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5434:5432"]
    volumes: ["treerasa_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treerasa -d treerasa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  treerasa_pgdata:
